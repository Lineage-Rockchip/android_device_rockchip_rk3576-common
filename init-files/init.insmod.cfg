# Modules loaded at boot, by /vendor/bin/init.insmod.sh.
#
# Format: [insmod|setprop] [path|prop name]
#
# WHY THIS FILE EXISTS
#
# init.insmod.sh loads /vendor_dlkm/lib/modules/modules.load first, but it tests
# "[ -f /vendor_dlkm/lib/modules/$name ]" for each entry -- it wants every name
# to carry its .ko suffix, because that is what Rockchip's own module packaging
# writes. LineageOS' kernel.mk writes the Android convention instead
# ("basename $MODULE .ko", so bare names), and against this script every one of
# those tests fails silently. So modules.load is inert here, and the ethernet
# MAC and PHY would never be loaded -- no eth0, no error anywhere.
#
# This cfg is the script's own second pass, it takes full paths, and the stock
# dump ships no copy of it, so supplying one is additive: no forked blob and no
# duplicate install rule. rk3576.mk installs it.
#
# Load order matters: the PHY driver must be in place before the MAC probes.
insmod /vendor_dlkm/lib/modules/realtek.ko
insmod /vendor_dlkm/lib/modules/r8168.ko

# NOT listed here on purpose: aic8800_bsp, aic8800_fdrv and aic8800_btlpm. The
# Wi-Fi HAL insmods the driver matching ro.vendor.wifi.chip when it starts, and
# init.insmod.sh skips anything named in /vendor/etc/wifi/wifi.load for exactly
# that reason. Loading them here as well would fight it.
